

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Flipbook</title>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

#book{
    width:1000px;
    height:700px;
}

.page{
    background:white;
    overflow:hidden;
}

.page img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.controls{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}
</style>
</head>
<body>

<div id="book">

<script>
for(let i=1;i<=100;i++){
    document.write(`
        <div class="page">
            <img src="page${i}.png">
        </div>
    `);
}
</script>

</div>

<div class="controls">
    <button onclick="flipBook.flipPrev()">◀ Prev</button>
    <button onclick="flipBook.flipNext()">Next ▶</button>
</div>

<script>

const flipBook = new St.PageFlip(
    document.getElementById("book"),
    {
        width:500,
        height:700,

        size:"stretch",

        minWidth:300,
        maxWidth:1200,

        minHeight:420,
        maxHeight:1600,

        showCover:true,

        usePortrait:true,

        mobileScrollSupport:true,

        flippingTime:900,

        drawShadow:true,

        maxShadowOpacity:0.5,

        startPage:0,

        autoSize:true
    }
);

flipBook.loadFromHTML(
    document.querySelectorAll(".page")
);

</script>

</body>
</html>
